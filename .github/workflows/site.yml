name: Wiki website

on:
  pull_request:
    paths:
      - .github/workflows/site.yml
      - .gitignore
      - AGENTS.md
      - README.md
      - data/**
      - llms.txt
      - requirements-site.txt
      - scripts/**
      - tests/**
      - website/**
      - wiki/**
  push:
    branches: [main]
    paths:
      - .github/workflows/site.yml
      - .gitignore
      - AGENTS.md
      - README.md
      - data/**
      - llms.txt
      - requirements-site.txt
      - scripts/**
      - tests/**
      - website/**
      - wiki/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Install site generator
        run: python -m pip install -r requirements-site.txt
      - name: Check generated wiki and source consistency
        run: |
          python scripts/build_wiki.py --check
          python scripts/validate_wiki.py
      - name: Test the site preparation script
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare and build site
        run: |
          python scripts/prepare_site.py
          zensical build --config-file .site/mkdocs.yml --strict
          python scripts/check_site.py
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site/public

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
